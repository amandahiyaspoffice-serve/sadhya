name: Build test APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Find project (unzip if needed)
        run: |
          if [ -z "$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)" ]; then
            z=$(find . -name '*.zip' -not -path './.git/*' | head -n 1)
            echo "Unzipping $z"
            unzip -q "$z" -d unzipped_project
          fi
          s=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)
          echo "PROJECT_DIR=$(dirname "$s")" >> "$GITHUB_ENV"

      - name: Create debug keystore
        run: |
          cd "$PROJECT_DIR"
          keytool -genkeypair -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
